---

- name: DJANGO OMniLeads application installation
  hosts: 
    - omnileads_app
    - omnileads_aio
  tags:
    - all_components
    - aio
    - app
    - django
  vars:
    INSTALL_PREFIX: "/opt/omnileads"

  tasks:

  - name: DJANGO environment variables for this installation
    template:
      src: "{{ django_repo_path }}templates/django.env"
      dest: /etc/default/django.env
      mode: 666
      owner: "{{ usuario }}"
      group: "{{ usuario }}"
    tags:
      - install
      - upgrade
      - update

  - name: DJANGO Copy systemd services
    template:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
    loop:
      - { src: "{{ django_repo_path }}templates/django.service", dest: "/etc/systemd/system/omnileads.service" }
      - { src: "{{ django_repo_path }}templates/background_callrec_tasks.service", dest: "/etc/systemd/system/background_tasks.service" }
      - { src: "{{ django_repo_path }}templates/background_dialer_tasks.service", dest: "/etc/systemd/system/background_dialer_tasks.service" }
      - { src: "{{ django_repo_path }}templates/email_events_processor.service", dest: "/etc/systemd/system/email_events_processor.service" }
      - { src: "{{ django_repo_path }}templates/whatsapp.service", dest: "/etc/systemd/system/whatsapp.service" }
      - { src: "{{ django_repo_path }}templates/daphne.service", dest: "/etc/systemd/system/daphne.service" }
    tags:
      - install
      - upgrade
      - update

  - name: DJANGO Pull image
    command: podman pull --quiet {{ omnileads_img }}
    register: podman_pull
    until: podman_pull is success
    tags:
      - install
      - upgrade
      - update

  - name: POSTGRESQL Create a new database with name {{ postgres_database }}
    postgresql_db:
      name: "{{ postgres_database }}"
      login_host: "{{ postgres_host }}"
      login_password: "{{ postgres_password }}"
      login_user: "{{ postgres_user }}"
      port: "{{ postgres_port }}"
      maintenance_db: "{{ postgres_maintenance_db }}"
      state: present
    tags:
      - install
    when: 
      - upgrade_from_oml_1 is not defined 
      - postgres_out == true

  - name: DJANGO run django_commands
    shell: "podman run --network=host --env-file /etc/default/django.env --volume=django_static:/opt/omnileads/static --rm {{ omnileads_img }} /opt/omnileads/bin/django_commands.sh"
    tags:
      - install      
    when:       
      - omnileads_ha is not defined
  
  - name: DJANGO run migrations 
    shell: "podman run --network=host --env-file /etc/default/django.env --rm {{ omnileads_img }} /opt/omnileads/bin/django_migrations.sh"
    tags:  
      - install
      - upgrade
      - update
    when:
      - omnileads_ha is not defined  

  - name: DJANGO Enable and start systemd services
    systemd:
      name: "{{ item }}"
      state: started
      enabled: yes
      daemon_reload: yes
    loop:
      - daphne.service
      - omnileads.service
      - background_tasks.service
      - background_dialer_tasks.service
      - email_events_processor.service
      - whatsapp.service
    tags:
      - install
      - upgrade
    when:       
      - omnileads_ha is not defined
      
  - name: DJANGO reset admin pass
    shell: "podman run --network=host --env-file /etc/default/django.env --rm {{ omnileads_img }} python /opt/omnileads/ominicontacto/manage.py cambiar_admin_password"
    tags:
      - install
    when:
      - upgrade_from_oml_1 is not defined
      - omnileads_ha is not defined
      - backup_filename is not defined
    
  - name: DJANGO Restart systemd services
    systemd:
      name: "{{ item }}"
      state: restarted
      enabled: yes
      daemon_reload: yes
    loop:
      - daphne.service
      - omnileads.service
      - background_tasks.service
      - background_dialer_tasks.service
      - email_events_processor.service
      - whatsapp.service
    tags:
      - upgrade
      - restart
      - restart_django
      - restart_core
      - restart_background_tasks
      - restart_email_events_processor
      - restart_whatsapp
    when:       
      - inventory_hostname in groups['omnileads_app'] or inventory_hostname in groups['omnileads_aio']    
      - omnileads_ha is not defined

- name: DJANGO Include High Availability playbook
  import_playbook: ha.yml
  when: omnileads_ha is defined