server:
  http_listen_port: 9080
  http_listen_address: {{ omni_ip_lan | default('0.0.0.0') }}

positions:
  filename: /tmp/positions.yaml
  sync_period: 1m

clients:
{% if tenant_id is defined and tenant_id != '' %}
  - url: http://{{ loki_host | default('127.0.0.1') }}:3100/loki/api/v1/push
    tenant_id: {{ tenant_id }}
{% else %}
  - url: http://{{ loki_host | default('127.0.0.1') }}:3100/loki/api/v1/push
{% endif %}
    batchsize: 102400
    batchwait: 1s
    backoff_config:
      min_period: 1s
      max_period: 10s

# ============================================
# DIALER SERVICE MACROS (Defined first)
# ============================================
{%- macro dialer_worker_type_config(worker_type, node_type) -%}
- job_name: dialer_process_{{ worker_type }}
  journal:
    json: false
    max_age: 6h
    path: /var/log/journal
    labels:
      job: dialer_process_{{ worker_type }}
      tenant: {{ tenant_id | default('unknown') }}
      host: {{ inventory_hostname }}
      node_type: {{ node_type }}
      service_family: dialer
      service_type: worker
      worker_type: {{ worker_type }}
      total_replicas: {{ vars['dialer_process_' ~ worker_type ~ '_replicas'] | default('unknown') }}
  relabel_configs:
    - source_labels: ['__journal__systemd_unit']
      regex: 'dialer_process_{{ worker_type }}@.*\.service'
      action: keep
    - source_labels: ['__journal__systemd_unit']
      target_label: 'unit'
    - source_labels: ['__journal__systemd_unit']
      regex: 'dialer_process_{{ worker_type }}@(.+)\.service'
      target_label: 'instance_id'
      replacement: '${1}'
    - source_labels: ['instance_id']
      target_label: 'worker_instance'
      replacement: '{{ worker_type }}-${1}'
    - source_labels: ['__journal_container_name']
      target_label: 'container_name'
    - source_labels: ['__journal_container_id']
      regex: '(.{12}).*'
      target_label: 'container_id'
      replacement: '${1}'
{%- endmacro -%}

{%- macro dialer_services_config(node_type, services_list) -%}
{% for service in services_list %}
- job_name: {{ service }}
  journal:
    json: false
    max_age: 6h
    path: /var/log/journal
    matches: "_SYSTEMD_UNIT={{ service }}.service"
    labels:
      job: {{ service }}
      tenant: {{ tenant_id | default('unknown') }}
      host: {{ inventory_hostname }}
      node_type: {{ node_type }}
      service_family: dialer
  relabel_configs:
    - source_labels: ['__journal__systemd_unit']
      target_label: 'unit'
    - source_labels: ['__journal_container_name']
      target_label: 'container_name'
    - source_labels: ['__journal_container_id']
      regex: '(.{12}).*'
      target_label: 'container_id'
      replacement: '${1}'
{% endfor %}
{%- endmacro -%}

{%- macro dialer_all_services_block() -%}
{% set node_type = 'aio' if inventory_hostname in groups.get('omnileads_aio', []) else 'standalone' %}
{{ dialer_worker_type_config('campaign', node_type) | indent(2, true) }}
{{ dialer_worker_type_config('contact', node_type) | indent(2, true) }}
{{ dialer_worker_type_config('event', node_type) | indent(2, true) }}
{% set all_dialer_services = [
  'dialer_incidence_rules', 'dialer_asterisk', 'dialer_manaege_campaign',
  'dialer_dialplan', 'dialer_flask', 'dialer_listener', 'dialer_postgresql',
  'dialer_render_template', 'dialer_scheduler', 'dialer_send_reports',] %}
{{ dialer_services_config(node_type, all_dialer_services) | indent(2, true) }}
{%- endmacro -%}

