
# ============================================================================
# YAML Templates (Anchors)
# ============================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart-policy: &restart-policy
  restart: on-failure

x-healthcheck-http: &healthcheck-http
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-healthcheck-tcp: &healthcheck-tcp
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

# Django common template
x-django-common: &django-common
  build: 
      context: ./$REPO_PATH/django/
      dockerfile: Dockerfile
  image: ${OML_APP_IMG}
  dns: 8.8.8.8
  networks:
    - omnileads
  restart: on-failure
  logging: *default-logging
  stdin_open: true
  tty: true
  environment: &django-env
    ASTERISK_HOSTNAME: ${ACD_HOSTNAME}
    AMI_USER: ${ACD_AMI_USER}
    AMI_PASSWORD: ${ACD_AMI_PASSWORD}
    AWS_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
    AWS_DEFAULT_REGION: "us-east-1"
    CALIFICACION_REAGENDA: ${CALIFICACION_REAGENDA}
    CALLREC_DEVICE: ${CALLREC_DEVICE}
    TEKOMI_CRM_BRIDGE_SHARED_SECRET: ${CRM_BRIDGE_SHARED_SECRET}
    TEKOMI_CRM_CONTACT_DATABASE_NAME: CRM_MASTER
    TEKOMI_CRM_BRIDGE_URL: http://crm-bridge:8080
    TEKOMI_CRM_BRIDGE_API_KEY: ${CRM_BRIDGE_API_KEY}
    CRON_ENABLE: "false"
    DJANGO_HOSTNAME: ${DJANGO_HOSTNAME}
    DJANGO_ALLOW_ASYNC_UNSAFE: "true"
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
    EMAIL_BACKEND: "django.core.mail.backends.dummy.EmailBackend"
    EPHEMERAL_USER_TTL: ${EPHEMERAL_USER_TTL}
    GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    GOOGLE_MAPS_CENTER: '${GOOGLE_MAPS_CENTER}'
    INSTALL_PREFIX: ${INSTALL_PREFIX}    
    KAMAILIO_HOSTNAME: ${KAMAILIO_WEBRTC_HOSTNAME}
    KAMAILIO_PORT: ${KAMAILIO_WEBRTC_SIP_PORT}
    LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT}    
    MONITORFORMAT: "mp3"  
    OML_BRANCH: ${OML_APP_IMG}
    OML_COMMIT: ${OML_APP_IMG}
    OML_BUILD_DATE: ${OML_APP_IMG}
    OML_LOGGING_SLOWSQL_ENABLED: ""
    OML_LOGGING_SLOWSQL_OUTPUT: "-"
    OML_LOGGING_SLOWSQL_DURATION: 1
    OMNILEADS_HOSTNAME: ${NGINX_HOSTNAME}
    OML_DIALER_ENGINE: ${DIALER_ENGINE}
    OML_OMNIDIALER_SECRET: ${DIALER_PASSWORD}
    OMNIDIALER_HOST: ${DIALER_API_HOST}    
    PYTHONPATH: ${PYTHONPATH}
    TZ: ${TZ}
    PGHOST: ${POSTGRES_HOSTNAME}
    PGDATABASE: ${POSTGRES_DB}
    PGPORT: ${POSTGRES_PORT}
    PGUSER: ${POSTGRES_USER}
    PGPASSWORD: ${POSTGRES_PASSWORD}
    PGHOSTHA: ${POSTGRES_HA}
    PGHOSTRO: ${POSTGRES_NODE_RO}  
    REDIS_HOSTNAME: ${REDIS_HOSTNAME}
    S3_STORAGE_ENABLED: "true"
    S3_BUCKET_NAME: ${BUCKET_NAME}
    S3_ENDPOINT: ${BUCKET_ENDPOINT}
    S3_ENDPOINT_MINIO: ${BUCKET_ENDPOINT_MINIO}
    SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE}
    UWSGI_PORT: ${UWSGI_PORT}
    WEBSOCKET_HOST: ${WEBSOCKET_HOSTNAME}
    WEBSOCKET_PORT: ${WEBSOCKET_PORT}
    WOMBAT_HOSTNAME: "wombat"
    WOMBAT_USER: "demoadmin"
    WOMBAT_PASSWORD: "demo"
# Django web common template
x-django-web-common: &django-web-common
  <<: *django-common
  working_dir: /opt/omnileads/ominicontacto
  stop_grace_period: 30s
  deploy:
    resources:
      limits:
        memory: 2G
        cpus: '1.0'
      reservations:
        memory: 512M
        cpus: '0.25'
# Django worker common template
x-django-worker-common: &django-worker-common
  <<: *django-common
  depends_on:
    postgresql:
      condition: service_healthy
    redis:
      condition: service_healthy
  working_dir: /opt/omnileads/ominicontacto
  stop_grace_period: 30s
# Worker common template
x-worker-common: &worker-common
  build:
    context: ./$REPO_PATH/dialer/workers/handle-campaign/src
  image: ${DIALER_WORKER_IMG}
  networks:
    - omnileads
  restart: on-failure
  logging: *default-logging
  stop_signal: SIGINT
  tty: true
  stdin_open: true
  depends_on:
    dialer-postgresql:
      condition: service_healthy
    gearman:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &worker-env
    GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
    ASTERISK_HOST: ${DIALER_ASTERISK_HOSTNAME}
    ASTERISK_PORT: ${DIALER_ASTERISK_ARI_PORT}
    ASTERISK_USER: ${ACD_AMI_USER}
    ASTERISK_PASS: ${ACD_AMI_PASSWORD}
    ASTERISK_APP: "call_manager"
    CAPS: ${DIALER_CAPS}
    DIALER_ACD_HOST: "pstn_gateway"
    POSTGRES_OML_SERVER: ${POSTGRES_HOSTNAME}
    POSTGRES_OML_PORT: ${POSTGRES_PORT}
    POSTGRES_OML_USER: ${POSTGRES_USER}
    POSTGRES_OML_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DIALER_SERVER: ${DIALER_POSTGRES_SERVER}
    POSTGRES_DIALER_PORT: ${DIALER_POSTGRES_PORT}
    POSTGRES_DIALER_USER: ${DIALER_POSTGRES_USER}
    POSTGRES_DIALER_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DIALER_DB: ${DIALER_POSTGRES_DB}
    REDIS_OML_SERVER: ${REDIS_HOSTNAME}
    REDIS_OML_PORT: ${REDIS_PORT}
    REDIS_DIALER_SERVER: ${REDIS_HOSTNAME}
    REDIS_DIALER_PORT: ${REDIS_PORT}
    PYTHON_LOGLEVEL: ${DIALER_PYTHON_LOGLEVEL}
    TIME_BETWEEN_CALLS: ${DIALER_TIME_BETWEEN_CALLS}
    TZ: ${TZ}

# ============================================================================
# NETWORKS & VOLUMES
# ============================================================================
networks:
  omnileads:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${SUBNET}"

volumes:
  postgresql:
  redis:
  minio:
  django_static:
  django_callrec_zip:
  django_media:
  asterisk_callrec:
  asterisk_sounds:
  asterisk_conf:
  dialer-postgresql:
  redis_redisinsight: 
  faster_whisper_cache:
  crm_bridge_data:
  
# ============================================================================
# SERVICES
# ============================================================================
services:

  # ----------------------------------------------------------------------------
  # BACKEND SERVICES
  # ----------------------------------------------------------------------------
  postgresql:
    image: ${POSTGRES_IMG}
    dns: 8.8.8.8
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - omnileads
    ports:
      - ${PG_EXT_BIND_IP:-0.0.0.0}:${PG_EXT_PORT:-5432}:5432/tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 90s
    volumes:
      - postgresql:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
 
  redis:
    image: ${REDIS_IMG}
    dns: 8.8.8.8
    environment:
      TZ: ${TZ}
      BIND_IP: 0.0.0.0
    networks:
      - omnileads
    ports:
      - ${REDIS_EXT_BIND_IP:-0.0.0.0}:${REDIS_EXT_PORT}:6379/tcp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-tcp
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 30s
    volumes:
      - redis:/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  minio:
    image: ${MINIO_IMG}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_HTTP_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_HTTP_ADMIN_PASS}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      TZ: ${TZ}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      <<: *healthcheck-tcp
    networks:
      - omnileads
    ports:
      - ${MINIO_EXT_BIND_IP:-0.0.0.0}:${MINIO_EXT_PORT:-9000}:9000/tcp
      - ${MINIO_EXT_BIND_IP:-0.0.0.0}:${MINIO_EXT_CONSOLE_PORT:-9001}:9001/tcp
    restart: on-failure
    logging: *default-logging
    volumes:
      - minio:/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - omnileads
    logging: *default-logging
    restart: "no"  # Solo ejecutar una vez
    entrypoint: >
      /bin/sh -c "
      echo 'Esperando a que MinIO esté listo...';
      sleep 5;
      echo 'Configurando alias de MinIO...';
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_HTTP_ADMIN_USER} ${MINIO_HTTP_ADMIN_PASS};
      echo 'Verificando conexión...';
      /usr/bin/mc admin info myminio;
      echo 'Creando bucket omnileads...';
      /usr/bin/mc mb myminio/omnileads --ignore-existing;
      echo 'Creando usuario omlminio...';
      /usr/bin/mc admin user add myminio omlminio s3omnileads123;
      echo 'Asignando política readwrite al usuario...';
      /usr/bin/mc admin policy attach myminio readwrite --user omlminio;
      echo 'Configuración completada exitosamente';
      "

  gearman:
    image: ${GEARMAN_IMG}
    environment:
      TZ: ${TZ}
    ports:
      - ${GEARMAN_EXT_BIND_IP:-0.0.0.0}:${GEARMAN_EXT_PORT:-4730}:4730/tcp
    networks:
      - omnileads
    command: gearmand -t 1
    healthcheck:
      test: ["CMD-SHELL", "gearadmin --status"]
      <<: *healthcheck-tcp
      start_period: 40s
    restart: on-failure
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # DJANGO APPLICATION SERVICES
  # ----------------------------------------------------------------------------
  django-app:
    <<: *django-web-common
    depends_on:
      django-commands:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      acd:
        condition: service_healthy
    command: /opt/omnileads/bin/init_uwsgi.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL -o /dev/null http://${DJANGO_HOSTNAME}:${DJANGO_PORT:-8099}/ || exit 1"]
      <<: *healthcheck-http
      start_period: 90s
    ports:
      - ${UWSGI_EXT_BIND_IP:-0.0.0.0}:${UWSGI_EXT_PORT:-8099}:8099/tcp
    volumes:
      - django_static:/opt/omnileads/static
      - django_callrec_zip:/opt/omnileads/asterisk/var/spool/asterisk/monitor
      - django_media:/opt/omnileads/media_root
  
  cronos:
    <<: *django-common
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *django-env
    command: /opt/omnileads/bin/init_cronos.sh
    working_dir: /opt/omnileads
    stop_grace_period: 90s
  
  django-commands:
    <<: *django-common
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: /opt/omnileads/bin/django_commands.sh
    working_dir: /opt/omnileads/ominicontacto
    volumes:
      - django_static:/opt/omnileads/static
      - django_callrec_zip:/opt/omnileads/asterisk/var/spool/asterisk/monitor
    stop_grace_period: 30s
  
  daphne:
    <<: *django-common
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *django-env
      DAPHNE_ENABLE: "true"
      DAPHNE_PORT: ${DAPHNE_PORT:-8098}
      DJANGO_HOSTNAME: ${DAPHNE_HOSTNAME}
    command: /opt/omnileads/bin/init_daphne.sh
    working_dir: /opt/omnileads/ominicontacto
    stop_grace_period: 90s
    ports:
      - ${UWSGI_EXT_BIND_IP:-0.0.0.0}:${DAPHNE_EXT_PORT:-8098}:8098/tcp
  
  email_events_processor:
    <<: *django-worker-common
    command: /opt/omnileads/bin/init_email_fetch_service.sh
  
  whatsapp:
    <<: *django-worker-common
    command: /opt/omnileads/bin/init_whatsapp.sh

  background_tasks:
    <<: *django-worker-common
    command: /opt/omnileads/bin/init_worker_bgtasks.sh
  
  background-dialer-tasks:
    <<: *django-worker-common
    command: python manage.py omnidialer_events_listener

  # background-supervision-tasks:
  #   <<: *django-worker-common
  #   command: python manage.py supervision_events_listener
  # ----------------------------------------------------------------------------
  # WEBSOCKET & WEBSERVER SERVICES
  # ----------------------------------------------------------------------------
  websockets:
    build:
      context: ./$REPO_PATH/websocket-server/
      target: run
      dockerfile: ./etc/fts/oml/services/websockets/dockerfile
    image: ${OML_WS_IMG}
    depends_on:
      - redis
    environment:
      BIND_ADDRESS: "0.0.0.0:8000"
      EVENT_LOOP: "uvloop"
      LOGGERS: ${WEBSOCKET_LOGGER}
      REDIS_HOST: ${WEBSOCKET_REDIS_HOSTNAME}
      PYTHONUNBUFFERED: 1
      TZ: ${TZ}
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 30s
    ports:
      - ${WEBSOCKET_EXT_BIND_IP:-0.0.0.0}:${WEBSOCKET_EXT_PORT:-8000}:8000/tcp
  
  nginx:
    build:
      context: ./$REPO_PATH/nginx/
      dockerfile: Dockerfile
    image: ${OML_NGINX_IMG}
    depends_on:
      django-app:
        condition: service_healthy
      daphne:
        condition: service_started
      kamailio-webrtc:
        condition: service_started
      websockets:
        condition: service_started
    environment:
      ASGI_PORT: ${DAPHNE_PORT}
      CALLREC_DEVICE: ${CALLREC_DEVICE}
      DJANGO_HOSTNAME: ${OML_HOSTNAME}
      DAPHNE_HOSTNAME: ${OML_HOSTNAME}
      KAMAILIO_HOSTNAME: ${KAMAILIO_WEBRTC_HOSTNAME}
      KAMAILIO_PORT: ${KAMAILIO_HTTPS_PORT}
      S3_ENDPOINT: ${BUCKET_ENDPOINT_MINIO}
      TZ: ${TZ}
      WEBSOCKETS_HOSTNAME: ${OML_HOSTNAME}
      WEBSOCKETS_PORT: ${WEBSOCKET_PORT}
      WEBUI_MODE: ${NGINX_WEBUI_MODE}
      WALLBOARD_WEBUI_PATH: ${NGINX_WALLBOARD_WEBUI_PATH}
      PREMIUMREPORTS_WEBUI_PATH: ${NGINX_PREMIUMREPORTS_WEBUI_PATH}
      SURVEY_WEBUI_PATH: ${NGINX_SURVEY_WEBUI_PATH}
      APP_WEBUI_PATH: ${APP_WEBUI_PATH}
      WSGI_PORT: ${UWSGI_PORT}
    dns: 8.8.8.8
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost/health"]
      <<: *healthcheck-http
      start_period: 30s
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 15s
    volumes:
      - django_static:/opt/omnileads/static
      - django_callrec_zip:/opt/omnileads/asterisk/var/spool/asterisk/monitor
      - ./crm-bridge-proxy.conf:/etc/nginx/conf.d/environment/00-crm-bridge.conf:ro
      # - ../.custom_conf/certs/:/etc/omnileads/certs:ro

  # ----------------------------------------------------------------------------
  # TELEPHONY SERVICES
  # ----------------------------------------------------------------------------
  acd:
    build: 
      context: ./$REPO_PATH/acd/
      dockerfile: Dockerfile
    image: ${OML_ACD_IMG}
    depends_on:
      fastagi:
        condition: service_started
      gearman:
        condition: service_healthy
    environment:
      AMI_USER: ${ACD_AMI_USER}
      AMI_PASSWORD: ${ACD_AMI_PASSWORD}
      API_LISTEN_IP: ${ACD_API_LISTEN_IP}
      ASTERISK_HOSTNAME: ${ACD_HOSTNAME}
      CALLREC_SPLIT_CHANNELS: ${ACD_CALLREC_SPLIT}
      DIALER_ENGINE: ${DIALER_ENGINE}
      DIALER_HOST: ${DIALER_SIP_ADDR}
      ENV: ${VOIP_ENV}
      FASTAGI: ${FASTAGI_HOSTNAME}
      GEARMAN_HOST: ${GEARMAN_HOSTNAME}    
      HOMER_ENABLE: ${HOMER_ENABLE}
      HOMERHOST: ${HOMER_HOSTNAME}
      HOMERPORT: ${HOMER_PORT}
      LOG_LEVEL: ${ACD_LOG_LEVEL}
      RTP_ADDR: ${RTPENGINE_RTP_ADDR}
      RTP_PORT_MAX: ${ACD_RTP_PORT_MAX}
      RTP_PORT_MIN: ${ACD_RTP_PORT_MIN}
      SCALE: ${ACD_SCALE}
      PJSIP_IP_DIALER: ${ACD_PJSIP_TRANSPORT_DIALER}
      PJSIP_IP_AGENT: ${ACD_PJSIP_TRANSPORT_AGENT}
      PJSIP_IP_TRUNK: ${ACD_PJSIP_TRANSPORT_TRUNK}
      PUBLIC_IP: ${PUBLIC_IP}
      NAT: ${VOIP_NAT}    
      TZ: ${TZ}          
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show channels' | grep -q 'active channels' || exit 1"]
      <<: *healthcheck-tcp
    privileged: true
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 30s
    working_dir: /etc/asterisk
    network_mode: host
    volumes:
    - asterisk_callrec:/var/spool/asterisk/monitor/
    - asterisk_conf:/etc/asterisk/retrieve_conf
    - asterisk_sounds:/var/lib/asterisk/sounds
    # - ./.custom_conf/extensions.conf:/etc/asterisk/oml_extensions_custom.conf:ro
    
  fastagi:
    build: 
      context: ./$REPO_PATH/fastagi/
      dockerfile: Dockerfile
    image: ${OML_FASTAGI_IMG}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python /app/fastagi.py
    environment:
      DIALER_AMD_ENDPOINT: ${DIALER_API_HOST}
      OMNILEADS_HOSTNAME: ${NGINX_HOSTNAME}
      PGHOST: ${POSTGRES_HOSTNAME}
      PGPORT: ${POSTGRES_EXT_PORT}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOSTNAME: ${REDIS_HOSTNAME}
      REDIS_PORT: ${REDIS_EXT_PORT}      
      TZ: ${TZ}
    restart: on-failure
    logging: *default-logging
    networks:
      - omnileads
    ports:
      - ${FASTAGI_EXT_BIND_IP:-0.0.0.0}:${FASTAGI_EXT_PORT:-4573}:4573/tcp
 
  ami:
    build: 
      context: ./$REPO_PATH/ami/
      dockerfile: Dockerfile
    image: ${OML_AMI_IMG}
    depends_on:
      redis:
        condition: service_healthy
      acd:
        condition: service_healthy
    environment:
      ASTERISK_HOSTNAME: ${ACD_HOSTNAME}
      AMI_USER: ${ACD_AMI_USER}
      AMI_PASSWORD: ${ACD_AMI_PASSWORD}
      REDIS_HOSTNAME: ${REDIS_HOSTNAME}
      TZ: ${TZ}
    restart: on-failure
    logging: *default-logging
    networks:
      - omnileads
 
  acd-config-generator:
    build: 
      context: ./$REPO_PATH/acd_configurator/
      dockerfile: Dockerfile
    image: ${OML_ACD_CONF_IMG}
    depends_on:
      nginx:
        condition: service_healthy
    dns: 8.8.8.8
    environment:
      ASTERISK_LOCATION: ""
      ARI_HOST: ${ACD_HOSTNAME}
      ARI_USER: ${ACD_AMI_USER}
      ARI_PASS: ${ACD_AMI_PASSWORD}
      OMNILEADS_HOSTNAME: ${NGINX_HOSTNAME}
      TZ: ${TZ}
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 10s
    volumes:
      - asterisk_conf:/home/omnileads/astconf
      - asterisk_sounds:/home/omnileads/sounds
 
  kamailio-webrtc:
    build: 
      context: ./$REPO_PATH/kamailio-webrtc/
      dockerfile: Dockerfile
    image: ${OML_KAM_IMG}
    depends_on:
      redis:
        condition: service_healthy
      rtpengine:
        condition: service_started
    environment:
      AUTHEPH_SK: ${AUTHEPH_SK}
      ASTERISK_HOSTNAME: ${ACD_HOSTNAME}
      KAMAILIO_CERTS_LOCATION: ${KAMAILIO_CERTS_LOCATION}
      KAMAILIO_HOSTNAME: ${KAMAILIO_WEBRTC_HOSTNAME}
      # Tekomi: public IP for the device UDP socket (softphone/IPPhone).
      # Defaults to OML_HOSTNAME; override if Kamailio must bind elsewhere.
      KAMAILIO_PUBLIC_IP: ${KAMAILIO_PUBLIC_IP:-${OML_HOSTNAME}}
      # Kamailio is deliberately on host networking. In AIO it must reach the
      # Redis port published on the same host, not loop back through the
      # public address (that route is commonly rejected by VPS firewalls).
      # HA installations override this with their Redis service/VIP.
      REDIS_HOSTNAME: ${KAMAILIO_REDIS_HOSTNAME:-127.0.0.1}
      RTPENGINE_HOSTNAME: ${RTPENGINE_HOSTNAME}
      SHM_SIZE: ${SHM_SIZE}
      PKG_SIZE: ${PKG_SIZE}
      TZ: ${TZ}
    dns: 8.8.8.8
    privileged: true
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 10s    
    network_mode: host
    volumes:
      # Tekomi: override kamailio.cfg con auth de dispositivos (softphone/IPPhone).
      # Quitar el mount para volver al comportamiento upstream.
      - ../custom/kamailio-webrtc/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    # volumes:
    #   - ./certs/:${KAMAILIO_CERTS_LOCATION}

  rtpengine:
    build: 
      context: ./$REPO_PATH/rtpengine/
      dockerfile: Dockerfile
    image: ${OML_RTPENGINE_IMG}
    environment:
      ENV: ${VOIP_ENV}
      NG_BIND_UDP_PORT: ${RTPENGINE_BIND_UDP_PORT}
      NAT: ${VOIP_NAT}
      LOG_LEVEL: ${RTPENGINE_LOG_LEVEL}
      PUBLIC_IP: ${RTPENGINE_HOSTNAME}
      RTPENGINE_HOSTNAME: ${RTPENGINE_HOSTNAME}
      RTP_PORT_MIN: ${RTPENGINE_RTP_PORT_MIN}
      RTP_PORT_MAX: ${RTPENGINE_RTP_PORT_MAX}
      RTP_ADDR: ${RTPENGINE_RTP_ADDR}
      TZ: ${TZ}  
    privileged: true
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 10s
    network_mode: host
    # command: rtpengine --config-file /etc/rtpengine.conf   
    # volumes:
    #   - ./.custom_conf/rtpengine.conf:/etc/rtpengine.conf:ro  

  # ----------------------------------------------------------------------------
  # PROCESSING SERVICES
  # ----------------------------------------------------------------------------
  callrec-compressor:
    build: 
      context: ./$REPO_PATH/postcall_actions/callrec_compressor/
      dockerfile: Dockerfile
    image: ${OML_CALLREC_COMPRESSOR_IMG}
    depends_on:
      minio:
        condition: service_healthy
      gearman:
        condition: service_healthy
    dns: 8.8.8.8
    environment:
      AWS_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${BUCKET_DEFAULT_REGION}
      CALLREC_DEVICE: ${CALLREC_DEVICE}
      GEARMAN_HOST: ${GEARMAN_HOSTNAME}
      S3_BUCKET_NAME: ${BUCKET_NAME}
      S3_ENDPOINT: ${BUCKET_ENDPOINT_MINIO}
      TZ: ${TZ}
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 10s
    volumes:
      - asterisk_callrec:/var/spool/asterisk/monitor/

  callrec-transcriber:
    build: 
      context: ./$REPO_PATH/postcall_actions/callrec_transcriber/
      dockerfile: Dockerfile
      target: saas
    image: ${OML_CALLREC_TRANSCRIBER_IMG}
    # Tekomi: STT transcriber disabled by default (heavy CPU: ~1 core per
    # 5-10 concurrent transcriptions). Re-enable with
    # `docker compose --profile transcriber up -d callrec-transcriber`.
    profiles:
      - transcriber
    depends_on:
      minio:
        condition: service_healthy
      gearman:
        condition: service_healthy
    dns: 8.8.8.8
    environment:
      AWS_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${BUCKET_DEFAULT_REGION}
      CALLREC_DEVICE: ${CALLREC_DEVICE}
      GEARMAN_HOST: ${GEARMAN_HOSTNAME}
      GOOGLE_APPLICATION_CREDENTIALS: ${STT_GCP_JSON_PATH}
      S3_BUCKET_NAME: ${BUCKET_NAME}
      S3_ENDPOINT: ${BUCKET_ENDPOINT_MINIO}
      STT_ENGINE: ${STT_ENGINE}
      STT_API_KEY: ${STT_API_KEY}
      TZ: ${TZ}
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 10s
    volumes:
      - asterisk_callrec:/var/spool/asterisk/monitor/
      - faster_whisper_cache:/opt/models
      # - ../.custom_conf/google_credentials.json:/${STT_GCP_JSON_PATH}:ro

  call-logger:
    build: 
      context: ./$REPO_PATH/call_logger/
      dockerfile: Dockerfile  
    image: ${OML_ACD_CALL_LOGGER_IMG}
    depends_on:
      gearman:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    dns: 8.8.8.8
    environment:
      GEARMAN_HOST: ${GEARMAN_HOSTNAME}
      PGHOST: ${POSTGRES_HOSTNAME}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOSTNAME: ${REDIS_HOSTNAME}
      REDIS_PORT: ${REDIS_PORT}
      TZ: ${TZ}
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 10s
    command: python /app/app.py

  crm-bridge:
    build:
      context: ../../crm-bridge
    image: tekomi/crm-bridge:local
    environment:
      PORT: "8080"
      # In HA this hostname is the OmniLeads PostgreSQL RW VIP.  Bridge state
      # never lives on a local container volume.
      BRIDGE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOSTNAME}:${POSTGRES_PORT}/${POSTGRES_DB}
      CRM_BASE_URL: ${CRM_BASE_URL}
      CRM_API_TOKEN: ${CRM_API_TOKEN}
      CRM_REQUEST_INTERVAL_SECONDS: ${CRM_REQUEST_INTERVAL_SECONDS:-1.5}
      OML_SYNC_URL: http://django-app:${UWSGI_PORT}/api/v1/tekomi-crm-bridge/contacts/sync/
      BRIDGE_API_KEY: ${CRM_BRIDGE_API_KEY}
      BRIDGE_SHARED_SECRET: ${CRM_BRIDGE_SHARED_SECRET}
      BRIDGE_QUEUE_DEPARTMENTS: ${CRM_BRIDGE_QUEUE_DEPARTMENTS}
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging

  # One instance per voice node in HA (Ansible deploys the same image locally
  # on every omnileads_voice host). It never owns state; PostgreSQL is shared.
  crm-bridge-ami:
    image: tekomi/crm-bridge:local
    command: python /app/ami_collector.py
    # Asterisk uses host networking in OmniLeads. The adapter must share that
    # namespace to reach its node-local AMI; using the public/VIP address
    # would both break AMI allow-lists and couple it to a remote node.
    network_mode: host
    environment:
      ASTERISK_HOSTNAME: 127.0.0.1
      AMI_USER: ${ACD_AMI_USER}
      AMI_PASSWORD: ${ACD_AMI_PASSWORD}
      # AIO: the local Bridge port. In HA the per-node service uses the
      # Bridge service/VIP endpoint instead of this compose definition.
      BRIDGE_URL: http://127.0.0.1:18080
      BRIDGE_API_KEY: ${CRM_BRIDGE_API_KEY}
      PBX_NODE_ID: ${PBX_NODE_ID:-aio-1}
    depends_on:
      crm-bridge:
        condition: service_started
    restart: on-failure
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # DIALER SERVICES
  # ----------------------------------------------------------------------------
  dialer-postgresql:
    image: ${POSTGRES_IMG}
    dns: 8.8.8.8
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${DIALER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DIALER_POSTGRES_DB}
      PGPORT: "5433"
    networks:
      - omnileads
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DIALER_POSTGRES_USER} -d ${DIALER_POSTGRES_DB} -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 90s
    volumes:
      - dialer-postgresql:/var/lib/postgresql/data
      - ../omnidialer.sql:/docker-entrypoint-initdb.d/init.sql

  dialer-api:
    image: ${DIALER_API_IMG}
    build:
      target: run
      context: ./$REPO_PATH/dialer/interface/src
    ports:
      - ${DIALER_API_EXT_BIND_IP:-0.0.0.0}:${DIALER_API_EXT_PORT:-1440}:1440/tcp
    networks:
      - omnileads
    stop_signal: SIGINT
    restart: on-failure
    logging: *default-logging
    tty: true
    stdin_open: true
    depends_on:
      dialer-postgresql:
        condition: service_healthy
    environment:
      GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
      WEBSOCKET_SERVER: ${DIALER_DCHANNELS_URL}
      TZ: ${TZ}

  dialer-acd:
    image: ${DIALER_ACD_IMG}
    build:
      context: ./$REPO_PATH/dialer/asterisk/
    environment:
      ASTERISK_HOST: ${DIALER_ASTERISK_HOSTNAME}
      ASTERISK_PORT: ${DIALER_ASTERISK_ARI_PORT}
      ASTERISK_USER: ${ACD_AMI_USER}
      ASTERISK_PASS: ${ACD_AMI_PASSWORD}
      OMLACD_SIP_SERVER: ${ACD_DIALER_PJSIP_TRANSPORT}
      PSTNGW_REGISTER: ${DIALER_PSTNGW_REGISTER}
      PSTNGW_SIP_AUTH: ${DIALER_PSTNGW_AUTH}
      PSTNGW_SIP_USER: ${DIALER_PSTNGW_USER}
      PSTNGW_SIP_PASS: ${DIALER_PSTNGW_PASS}
      PSTNGW_HOST: ${DIALER_PSTNGW_HOSTNAME}
      TZ: ${TZ}
    dns: 8.8.8.8
    privileged: true
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 30s
    working_dir: /etc/asterisk
    network_mode: host

  dialer-acd-dialplan:
    image: ${DIALER_ACD_DIALPLAN_IMG}
    build:
      target: run
      context: ./$REPO_PATH/dialer/dialplan/
    environment:
      ASTERISK_HOST: ${DIALER_ASTERISK_HOSTNAME}
      ASTERISK_PORT: ${DIALER_ASTERISK_ARI_PORT}
      ASTERISK_USER: ${ACD_AMI_USER}
      ASTERISK_PASS: ${ACD_AMI_PASSWORD}
      ASTERISK_APP: "dialer_dialplan"
      GEARMAN_HOST: ${GEARMAN_HOSTNAME}
      REDIS_DIALER_SERVER: ${REDIS_HOSTNAME}
      REDIS_DIALER_PORT: ${REDIS_PORT}
      REDIS_DB: ${DIALER_REDIS_DB}
      PYTHON_LOGLEVEL: ${DIALER_PYTHON_LOGLEVEL}
      TZ: ${TZ}
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 30s
    networks:
      - omnileads

  dialer-acd-event-listener:
    image: ${DIALER_ACD_LISTENER_IMG}
    build:
      context: ./$REPO_PATH/dialer/websocket_ari/src
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging
    tty: true
    stdin_open: true
    environment:
      <<: *worker-env
      ASTERISK_APP_DIALER: "call_manager_dialer"
    depends_on:
      dialer-postgresql:
        condition: service_healthy
      dialer-manage-campaign:
        condition: service_started

  dialer-manage-campaign:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "create-campaign|start-campaign|pause-campaign|resume-campaign|stop-campaign|edit-campaign|delete-campaign|change-database"

  dialer-incidence-rule-disposition:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "add-incidence-rule-disposition|delete-incidence-rule|create-incidence-rule|update-incidence-rule"

  dialer-scheduler:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "schedule-agenda"
      # SCHEDULER_API_HOST: dialer-api:1440
 
  dialer-process-contact:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "process-contact"

  dialer-process-campaign:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "process-campaign"
    deploy:
      replicas: ${DIALER_PROCESS_CAMPAIGN_REPLICAS:-5}

  dialer-process-event:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "process-event"
    deploy:
      replicas: ${DIALER_PROCESS_EVENT_REPLICAS:-1}

  dialer-send-reports:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "send-reports"

  dialer-render-template:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "render-template"

  dialer-manage:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "manage-dialer"
