  # ----------------------------------------------------------------------------
  # PROCESSING SERVICES
  # ----------------------------------------------------------------------------
  callrec-compressor:
    build: 
      context: ./$REPO_PATH/postcall_actions/callrec_compressor/
      dockerfile: Dockerfile
    image: ${OML_CALLREC_COMPRESSOR_IMG}
    depends_on:
      minio:
        condition: service_healthy
      gearman:
        condition: service_healthy
    dns: 8.8.8.8
    environment:
      AWS_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${BUCKET_DEFAULT_REGION}
      CALLREC_DEVICE: ${CALLREC_DEVICE}
      GEARMAN_HOST: ${GEARMAN_HOSTNAME}
      S3_BUCKET_NAME: ${BUCKET_NAME}
      S3_ENDPOINT: ${BUCKET_ENDPOINT_MINIO}
      TZ: ${TZ}
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 10s
    volumes:
      - asterisk_callrec:/var/spool/asterisk/monitor/

  callrec-transcriber:
    build: 
      context: ./$REPO_PATH/postcall_actions/callrec_transcriber/
      dockerfile: Dockerfile
      target: run
    image: ${OML_CALLREC_TRANSCRIBER_IMG}
    depends_on:
      minio:
        condition: service_healthy
      gearman:
        condition: service_healthy
    dns: 8.8.8.8
    environment:
      AWS_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${BUCKET_DEFAULT_REGION}
      CALLREC_DEVICE: ${CALLREC_DEVICE}
      GEARMAN_HOST: ${GEARMAN_HOSTNAME}
      GOOGLE_APPLICATION_CREDENTIALS: ${STT_GCP_JSON_PATH}
      S3_BUCKET_NAME: ${BUCKET_NAME}
      S3_ENDPOINT: ${BUCKET_ENDPOINT_MINIO}
      STT_ENGINE: ${STT_ENGINE}
      STT_API_KEY: ${STT_API_KEY}
      TZ: ${TZ}
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 10s
    volumes:
      - asterisk_callrec:/var/spool/asterisk/monitor/
      - faster_whisper_cache:/opt/models
      - ../.custom_conf/google_credentials.json:/${STT_GCP_JSON_PATH}:ro

  call-logger:
    build: 
      context: ./$REPO_PATH/call_logger/
      dockerfile: Dockerfile  
    image: ${OML_ACD_CALL_LOGGER_IMG}
    depends_on:
      gearman:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    dns: 8.8.8.8
    environment:
      GEARMAN_HOST: ${GEARMAN_HOSTNAME}
      PGHOST: ${POSTGRES_HOSTNAME}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOSTNAME: ${REDIS_HOSTNAME}
      REDIS_PORT: ${REDIS_PORT}
      TZ: ${TZ}
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 10s
    command: python /app/app.py

  # ----------------------------------------------------------------------------
  # DIALER SERVICES
  # ----------------------------------------------------------------------------
  dialer-postgresql:
    image: ${POSTGRES_IMG}
    dns: 8.8.8.8
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${DIALER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DIALER_POSTGRES_DB}
      PGPORT: "5433"
    networks:
      - omnileads
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DIALER_POSTGRES_USER} -d ${DIALER_POSTGRES_DB} -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 90s
    volumes:
      - dialer_postgresql:/var/lib/postgresql/data
      - ../omnidialer.sql:/docker-entrypoint-initdb.d/init.sql

  dialer-api:
    image: ${DIALER_API_IMG}
    build:
      target: run
      context: ./$REPO_PATH/dialer/interface/src
    ports:
      - ${DIALER_API_EXT_BIND_IP:-0.0.0.0}:${DIALER_API_EXT_PORT:-1440}:1440/tcp
    networks:
      - omnileads
    stop_signal: SIGINT
    restart: on-failure
    logging: *default-logging
    tty: true
    stdin_open: true
    depends_on:
      dialer-postgresql:
        condition: service_healthy
    environment:
      GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
      WEBSOCKET_SERVER: ${DIALER_DCHANNELS_URL}
      TZ: ${TZ}

  dialer-acd-listener:
    image: ${DIALER_ACD_LISTENER_IMG}
    build:
      context: ./$REPO_PATH/dialer/websocket_ari/src
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging
    tty: true
    stdin_open: true
    environment:
      ASTERISK_HOST: ${DIALER_ASTERISK_HOSTNAME}
      ASTERISK_PORT: ${DIALER_ASTERISK_ARI_PORT}
      ASTERISK_USER: ${ACD_AMI_USER}
      ASTERISK_PASS: ${ACD_AMI_PASSWORD}
      ASTERISK_APP: "call_manager"
      ASTERISK_APP_DIALER: "call_manager_dialer"
      TZ: ${TZ}
      GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
    depends_on:
      dialer-postgresql:
        condition: service_healthy
      dialer-start-camp:
        condition: service_started

  dialer-acd:
    image: ${DIALER_ACD_IMG}
    build:
      context: ./$REPO_PATH/dialer/asterisk/
    environment:
      ASTERISK_HOST: ${DIALER_ASTERISK_HOSTNAME}
      ASTERISK_PORT: ${DIALER_ASTERISK_ARI_PORT}
      ASTERISK_USER: ${ACD_AMI_USER}
      ASTERISK_PASS: ${ACD_AMI_PASSWORD}
      OMLACD_SIP_SERVER: ${ACD_DIALER_PJSIP_TRANSPORT}
      PSTNGW_REGISTER: ${DIALER_PSTNGW_REGISTER}
      PSTNGW_SIP_AUTH: ${DIALER_PSTNGW_AUTH}
      PSTNGW_SIP_USER: ${DIALER_PSTNGW_USER}
      PSTNGW_SIP_PASS: ${DIALER_PSTNGW_PASS}
      PSTNGW_HOST: ${DIALER_PSTNGW_HOSTNAME}
      TZ: ${TZ}
    dns: 8.8.8.8
    privileged: true
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 30s
    working_dir: /etc/asterisk
    networks:
      omnileads:
        ipv4_address: ${DIALER_ASTERISK_IPV4} 

  dialer-acd-dialplan:
    image: ${DIALER_ACD_DIALPLAN_IMG}
    build:
      target: run
      context: ./$REPO_PATH/dialer/dialplan/
    environment:
      TZ: ${TZ}
      GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
      GEARMAN_TASK: ${GEARMAN_CALLLOG_TASK}
      REDIS_DIALER_SERVER: ${REDIS_HOSTNAME}
      REDIS_DIALER_PORT: ${REDIS_PORT}
      REDIS_DB: ${DIALER_REDIS_DB}
      ASTERISK_HOST: ${DIALER_ASTERISK_HOSTNAME}
      ASTERISK_PORT: ${DIALER_ASTERISK_ARI_PORT}
      ASTERISK_USER: ${ACD_AMI_USER}
      ASTERISK_PASS: ${ACD_AMI_PASSWORD}
      ASTERISK_APP: "call_manager"
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 30s
    networks:
      - omnileads

  dialer-process-contact:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "process-contact"
    deploy:
      replicas: ${DIALER_PROCESS_CONTACT_REPLICAS:-2}

  dialer-process-camp:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "process-campaign"
      SCHEDULER_API_HOST: ${DIALER_SCHEDULER_API_HOST} 
    deploy:
      replicas: ${DIALER_PROCESS_CAMPAIGN_REPLICAS:-2}

  dialer-scheduler:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "schedule-agenda"

  dialer-start-camp:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "start-campaign"

  dialer-create-camp:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "create-campaign"

  dialer-resume-camp:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "resume-campaign"

  dialer-edit-camp:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "edit-campaign"

  dialer-stop-camp:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "stop-campaign"

  dialer-pause-camp:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "pause-campaign"

  dialer-delete-camp:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "delete-campaign"

  dialer-change-database-camp:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "change-database"

  dialer-process-event:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "process-event"
    deploy:
      replicas: ${PROCESS_EVENT_REPLICAS:-2}

  dialer-send-reports:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "send-reports"

  dialer-add-incidence-rule:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "add-incidence-rule-disposition"

  dialer-create-incidence-rule:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "create-incidence-rule"

  dialer-delete-incidence-rule:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "delete-incidence-rule"

  dialer-update-incidence-rule:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "update-incidence-rule"

  dialer-render-template:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "render-template"

  dialer-manage-dialer:
    <<: *worker-common
    environment:
      <<: *worker-env
      GEARMAN_JOBS: "manage-dialer"

  # ----------------------------------------------------------------------------
  # OPTIONAL SERVICES
  # ----------------------------------------------------------------------------
  pbxemulator:
    image: pstn_emulator:latest
    build:
      context: ./$REPO_PATH/omlqa/pstn_emulator/
    hostname: pbxemulator
    environment:
      INBOUND_CALL_MODE: ${PSTN_EMULATOR_MODE}
      TZ: ${TZ}
    networks:
      - omnileads
    ports:
      - "4569:4569/udp"
    restart: on-failure
    logging: *default-logging
    stdin_open: true
    stop_grace_period: 30s
    tty: true

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "user@domain.com"
      PGADMIN_DEFAULT_PASSWORD: "catsarecool"
    restart: on-failure
    logging: *default-logging
    networks:
      - omnileads

  redisinsight:
    image: redis/redisinsight:latest
    environment:
      BIND_IP: "0.0.0.0"
      TZ: ${TZ}
    networks:
      - omnileads
    ports:
      - '7963:5540'
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 30s
    volumes:
      - redis_redisinsight:/data
